<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="تطبيق مراجعي MERAJ3I - المنصة التعليمية الشاملة">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="مراجعي">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>مراجعي | MERAJ3I</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // 1. تنظيف شامل وفوري لأي كاش أو Service Worker قديم
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var i = 0; i < names.length; i++) {
          caches.delete(names[i]);
        }
      });
    }

    // 2. نظام التحديث التلقائي الفوري في الخلفية بمجرد نشر أي تعديل جديد
    (function() {
      var currentBuild = '7.9.9_22';
      function checkForUpdate() {
        fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
          .then(function(res) { return res.json(); })
          .then(function(data) {
            var latestBuild = (data.version || '') + '_' + (data.build_number || '');
            if (latestBuild && latestBuild !== currentBuild) {
              console.log('[MERAJ3I] New update detected:', latestBuild);
              if ('caches' in window) {
                caches.keys().then(function(names) {
                  return Promise.all(names.map(function(n) { return caches.delete(n); }));
                }).then(function() {
                  window.location.reload(true);
                });
              } else {
                window.location.reload(true);
              }
            }
          })
          .catch(function(e) {});
      }

      // فحص دوري في الخلفية كل 15 ثانية
      setInterval(checkForUpdate, 15000);
      // فحص عند عودة المستخدم لتبويب التطبيق
      window.addEventListener('focus', checkForUpdate);
      window.addEventListener('visibilitychange', function() {
        if (!document.hidden) checkForUpdate();
      });
    })();

    // 3. تحميل ملف بدء تشغيل فلاتر بختم زمني ديناميكي يمنع الكاش نهائياً
    var flutterScript = document.createElement('script');
    flutterScript.src = 'flutter_bootstrap.js?t=' + Date.now();
    flutterScript.async = true;
    document.body.appendChild(flutterScript);
  </script>
</body>
</html>
