org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Duser.language=en -Duser.country=US
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
# Configuration Cache معطل - غير متوافق مع shorebird_trace_init.gradle
# السبب: سكربت Shorebird يستخدم Gradle.buildFinished وGradle.addListener وTask.project
# وهذه APIs محظورة عند تفعيل Configuration Cache في Gradle 8+
# المرجع: https://docs.shorebird.dev/troubleshooting/
org.gradle.configuration-cache=false
org.gradle.vfs.watch=true
android.useAndroidX=true
android.enableJetifier=false
android.builtInKotlin=false
android.newDsl=true
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
